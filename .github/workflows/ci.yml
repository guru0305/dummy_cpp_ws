name: ROS2 Humble CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # Validate test directories exist
      - name: Validate every package has test directory
        run: |
          echo "Checking that every ROS2 package has a test directory..."

          FAILED=0

          for pkg in src/*; do
            if [ -d "$pkg" ] && [ -f "$pkg/package.xml" ]; then
              PKG_NAME=$(basename "$pkg")

              if [ ! -d "$pkg/test" ]; then
                echo "❌ Package $PKG_NAME does NOT contain a test directory"
                FAILED=1
              else
                echo "✔ Package $PKG_NAME has test directory"
              fi
            fi
          done

          if [ $FAILED -eq 1 ]; then
            echo "One or more packages missing test directory"
            exit 1
          fi

      - name: Setup ROS2 repository
        run: |
          sudo apt update
          sudo apt install -y curl gnupg2 lsb-release
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key | sudo apt-key add -
          echo "deb http://packages.ros.org/ros2/ubuntu $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/ros2.list
          sudo apt update

      - name: Install ROS2 Humble
        run: |
          sudo apt install -y ros-humble-desktop python3-colcon-common-extensions

      - name: Build
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --event-handlers console_direct+

      - name: Test
        run: |
          source /opt/ros/humble/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose

          echo "Checking each package has at least one executed test..."

          FAILED=0

          for pkg in src/*; do
            if [ -d "$pkg" ] && [ -f "$pkg/package.xml" ]; then
              PKG_NAME=$(basename "$pkg")

              # Count any executed test (gtest, lint, xmllint, etc.)
              TEST_COUNT=$(grep -h "<testcase" build/$PKG_NAME/test_results/$PKG_NAME/*.xml 2>/dev/null | wc -l)

              if [ "$TEST_COUNT" -eq 0 ]; then
                echo "❌ Package $PKG_NAME has NO executed tests"
                FAILED=1
              else
                echo "✔ Package $PKG_NAME has $TEST_COUNT executed tests"
              fi
            fi
          done

          if [ $FAILED -eq 1 ]; then
            echo "One or more packages failed test validation"
            exit 1
          fi
