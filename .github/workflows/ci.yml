name: ROS2 Humble CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # Validate test directories
      - name: Validate every package has test directory
        run: |
          echo "Checking that every ROS2 package has a test directory..."

          FAILED=0

          for pkg in src/*; do
            if [ -d "$pkg" ]; then
              if [ ! -f "$pkg/package.xml" ]; then
                continue
              fi

              if [ ! -d "$pkg/test" ]; then
                echo "❌ Package $pkg does NOT contain a test directory"
                FAILED=1
              else
                echo "✔ Package $pkg has test directory"
              fi
            fi
          done

          if [ $FAILED -eq 1 ]; then
            echo "One or more packages missing test directory"
            exit 1
          fi

      - name: Setup ROS2 repository
        run: |
          sudo apt update
          sudo apt install -y curl gnupg2 lsb-release
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key | sudo apt-key add -
          echo "deb http://packages.ros.org/ros2/ubuntu $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/ros2.list
          sudo apt update

      - name: Install ROS2 Humble
        run: |
          sudo apt install -y ros-humble-desktop python3-colcon-common-extensions

      - name: Build
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --event-handlers console_direct+

      - name: Test
        run: |
          source /opt/ros/humble/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose

          echo "Checking if at least one valid test was executed..."

          # Count number of executed testcases from generated XML results
          TOTAL_TESTS=$(grep -h "<testcase" build/*/test_results/*/*.xml 2>/dev/null | wc -l)

          if [ "$TOTAL_TESTS" -eq 0 ]; then
            echo "❌ No valid tests were executed in this workspace"
            exit 1
          else
            echo "✔ Total valid tests executed: $TOTAL_TESTS"
          fi
